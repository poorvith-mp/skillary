name: validate

# The hub cannot see the category repos without checking them out. Every repo
# is public, so plain actions/checkout works with no token, no submodules and
# no manifest-publishing pipeline between them.
#
# A push to a category repo does not trigger this. That is deliberate: the
# per-repo workflow already catches skill-level problems, so the only thing
# this adds is index and manifest drift, and a nightly run closes that fast
# enough. Add repository_dispatch if a day ever turns out to be too slow.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: skillary

      - name: Check out category repos and agents
        run: |
          for c in developer marketing gamedev business design education \
                   agents personal writing sales finance legal; do
            git clone --depth 1 "https://github.com/poorvith-mp/skills-$c.git" "skills-$c"
          done
          git clone --depth 1 "https://github.com/poorvith-mp/skillary-agents.git" "skillary-agents"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: skillary
        run: uv sync

      - name: Run automated test suite
        working-directory: skillary
        run: uv run python -m pytest -q -W error

      - name: Skills validate
        working-directory: skillary
        run: uv run python scripts/validate.py

      - name: README index is current
        working-directory: skillary
        run: uv run python scripts/build_index.py --check

      - name: Manifests are current
        working-directory: skillary
        run: uv run python scripts/gen_manifests.py --check

      - name: Bundles match their source
        working-directory: skillary
        run: uv run python scripts/bundle.py --check

      - name: Overlapping skills name a sibling
        working-directory: skillary
        run: uv run python scripts/overlap.py --check-boundaries

      - name: Version numbers are synchronized
        working-directory: skillary
        run: uv run python scripts/check_version_sync.py

      - name: Generate quality report
        working-directory: skillary
        run: uv run python scripts/quality_report.py

      - name: Commit quality report on schedule
        if: github.event_name == 'schedule'
        working-directory: skillary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/quality.md
          git commit -m "chore(quality): update catalog quality report [skip ci]" || true
          git push || true
