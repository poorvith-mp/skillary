# Which verification archetype each skill gets.
#
# Repo name alone is not a sufficient key. skills-specialized spans compliance,
# healthcare, legal, HR, real estate and logistics; skills-business spans ops,
# strategy, PM and freelancing; and skills-developer contains changelog-writer
# and code-comment-writer, which are writing tasks wearing an engineering badge.
#
# So: a default per repo, then explicit overrides. Review THIS file once instead
# of reviewing 315 diffs - it is where all the judgment lives.

defaults:
  skills-developer: engineering
  skills-gamedev: engineering
  skills-design: creative-visual
  skills-writing: content-writing
  skills-marketing: go-to-market
  skills-education: instructional
  skills-finance: analysis-quant
  skills-personal: personal-planning
  skills-business: ops-process
  skills-sales-support: go-to-market
  skills-specialized: ops-process
  skills-meta: tooling

overrides:

  # --- writing tasks living in the developer repo ---
  changelog-writer: content-writing
  code-comment-writer: content-writing
  readme-generator: content-writing
  environment-setup-guide: content-writing
  bug-explainer: content-writing
  codebase-onboarding-engineer: content-writing

